name: Build and Package Ranki for Kindle Touch

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build shims
        run: |
          rustc --target armv7-unknown-linux-gnueabi --crate-type cdylib \
            -C linker=rust-lld -C panic=abort -O \
            tools/libk5compat/libk5compat.rs -o tools/libk5compat/libk5compat.so
          rustc --target armv7-unknown-linux-gnueabi --crate-type cdylib \
            -C linker=rust-lld -C panic=abort -O \
            tools/liblipc/liblipc.rs -o tools/liblipc/liblipc.so.1
          rustc --target armv7-unknown-linux-gnueabi --crate-type cdylib \
            -C linker=rust-lld -C panic=abort -O \
            tools/libcurl/libcurl.rs -o tools/libcurl/libcurl.so.4

      - name: Download base release assets
        run: |
          curl -sL https://github.com/crazy-electron/ranki/releases/download/v0.2/ranki.zip -o upstream_ranki.zip
          unzip upstream_ranki.zip -d extracted

      - name: Apply Kindle Touch 5.3.7.3 patch to ranki-armel
        run: |
          python3 tools/patcher/patch_glibc.py extracted/ranki/ranki-armel extracted/ranki/ranki-armel
          python3 tools/patcher/patch_ranki_media.py extracted/ranki/ranki-armel
          cp tools/libk5compat/libk5compat.so extracted/ranki/libk5compat.so
          cp tools/liblipc/liblipc.so.1 extracted/ranki/liblipc.so.1
          cp tools/libcurl/libcurl.so.4 extracted/ranki/libcurl.so.4
          cp ranki.sh extracted/ranki/ranki.sh
          cp menu.json extracted/ranki/menu.json
          cp toggle_media_sync.sh extracted/ranki/toggle_media_sync.sh
          chmod +x extracted/ranki/ranki.sh
          chmod +x extracted/ranki/toggle_media_sync.sh

      - name: Package release zip
        run: |
          mkdir -p dist
          cd extracted
          zip -r ../dist/ranki.zip ranki/
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ranki-kindle-touch
          path: dist/ranki.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ranki.zip
          generate_release_notes: true
